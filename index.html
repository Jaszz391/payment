<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Web Payment Jaszz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #000814;
    color: #00e5ff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow: auto;
    position: relative;
  }
  /* Neon lines on edges */
  body::before, body::after {
    content: "";
    position: fixed;
    width: 100vw;
    height: 4px;
    background: linear-gradient(90deg, transparent, #00e5ff, transparent);
    top: 0;
    left: 0;
    z-index: 10;
  }
  body::after {
    top: auto;
    bottom: 0;
  }
  .side-line-left, .side-line-right {
    position: fixed;
    top: 0;
    width: 4px;
    height: 100vh;
    background: linear-gradient(180deg, transparent, #00e5ff, transparent);
    z-index: 10;
  }
  .side-line-left { left: 0; }
  .side-line-right { right: 0; }

  /* Animasi mengambang */
  @keyframes floatUpDown {
    0%, 100% {
      transform: translateY(0);
      filter: drop-shadow(0 0 10px #00e5ff);
    }
    50% {
      transform: translateY(-15px);
      filter: drop-shadow(0 0 20px #00e5ff);
    }
  }

  .profile-pic {
    margin-top: 40px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #00e5ff;
    overflow: hidden;
    box-shadow: 0 0 15px #00e5ff;
    animation: floatUpDown 3s ease-in-out infinite;
  }
  .profile-pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  h1 {
    margin: 20px 0 30px;
    text-shadow: 0 0 8px #00e5ff;
  }

  .buttons {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
  }
  button {
    padding: 15px 40px;
    font-size: 18px;
    font-weight: bold;
    color: #000814;
    background: #00e5ff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 0 12px #00e5ff;
    transition: background 0.3s ease;
    animation: floatUpDown 3s ease-in-out infinite;
  }
  button:hover {
    background: #00b8cc;
  }

  .content-area {
    width: 280px;
    min-height: 320px;
    border: 2px solid #00e5ff;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 0 25px #00e5ff inset;
    background: rgba(0, 8, 20, 0.6);
    display: none; /* Hidden awalnya */
    margin-top: 10px;
  }
  .qris-img {
    max-width: 100%;
    border-radius: 15px;
    box-shadow: 0 0 20px #00e5ff;
  }
  .phone-number {
    font-size: 28px;
    font-weight: 600;
    margin-top: 60px;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #00e5ff;
  }

  .download-btn {
    margin-top: 15px;
    padding: 12px 30px;
    font-size: 16px;
    font-weight: 600;
    color: #000814;
    background: #00e5ff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 0 12px #00e5ff;
    transition: background 0.3s ease;
  }
  .download-btn:hover {
    background: #00b8cc;
  }
</style>
</head>
<body>

<div class="side-line-left"></div>
<div class="side-line-right"></div>

<div class="profile-pic">
  <img src="https://files.catbox.moe/j0jzk4.jpeg" alt="Foto Profil" />
</div>

<h1>Web Payment Jaszz</h1>

<div class="buttons">
  <button id="btnQris">QRIS</button>
  <button id="btnNope">NOPE</button>
</div>

<div class="content-area" id="contentArea">
  <!-- Konten QRIS atau nomor akan muncul di sini -->
</div>

<script>
  const btnQris = document.getElementById('btnQris');
  const btnNope = document.getElementById('btnNope');
  const contentArea = document.getElementById('contentArea');

  const qrisUrl = 'https://files.catbox.moe/l3esjb.jpeg';
  const myNumber = '085122332728';

  btnQris.addEventListener('click', () => {
    contentArea.style.display = 'block';
    contentArea.innerHTML = `
      <img src="${qrisUrl}" alt="QRIS" class="qris-img" />
      <button class="download-btn" id="btnDownload">Unduh QRIS</button>
    `;
    const btnDownload = document.getElementById('btnDownload');
    btnDownload.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = qrisUrl;
      a.download = 'qris-Jaszz.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  });

  btnNope.addEventListener('click', () => {
    contentArea.style.display = 'block';
    contentArea.innerHTML = `<div class="phone-number">${myNumber}</div>`;
  });
</script>

</body>
</html>
